<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veículo</title>
</head>
<body>
    <h1>Cadastro de veículo</h1>

    <form th:action="@{/veiculos/salvar}" th:object="${veiculo}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Modelo:</label>
        <input type="text" th:field="*{modelo}" style="text-transform: uppercase"><br><br>

        <label>Placa:</label>
        <input type="text" th:field="*{placa}" style="text-transform: uppercase"><br><br>

        <label>Ano:</label>
        <input type="number" th:field="*{ano}"><br><br>

        <label>Cor:</label>
        <input type="text" th:field="*{cor}" style="text-transform: uppercase"><br><br>

        <button type="submit">Salvar</button>
        <a th:href="@{/veiculos}">Cancelar</a>
    </form>
</body>
</html>
